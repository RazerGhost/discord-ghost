name: Build & publish

# On every push to main: build the theme, check the plugin builds inside a fresh
# Vencord checkout, then publish dist/ to the `dist` branch — what the Online
# Themes URL points at — and purge jsDelivr so its @dist copy updates too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time: two runs force-pushing `dist` at once make the slower
# one fail with "cannot lock ref". Queue instead.
concurrency:
  group: publish-dist-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # The plugin can only be type-checked and linted as part of Vencord. This runs
  # against Vencord's latest main, so a Vencord API change shows up here first.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check out Vencord
        run: git clone --depth 1 https://github.com/Vendicated/Vencord.git ../Vencord

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ../Vencord/package.json

      - name: Build Ghost inside Vencord
        working-directory: ../Vencord
        run: |
          mkdir -p src/userplugins
          cp -r "$GITHUB_WORKSPACE/dist/ghost" src/userplugins/ghost
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec eslint src/userplugins/ghost
          pnpm build

  publish:
    needs: plugin
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Publish to dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true

      # raw.githubusercontent.com (the documented URL) caches ~5 min on its own;
      # this refreshes the jsDelivr alternative, through its purge API directly
      # (the purge actions still run on the deprecated Node 20). jsDelivr
      # throttles purges after several pushes in a row — harmless, so it
      # mustn't fail the release.
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          for file in ghost.theme.css ghost-oled.theme.css; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@dist/$file"
            echo
          done
