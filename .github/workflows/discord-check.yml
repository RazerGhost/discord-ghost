name: Discord check

# Discord ships new builds several times a week and renames classes with them.
# Every Monday (and on demand), check that the class prefixes and variables
# Ghost hooks into still exist in Discord's current CSS. A failed run emails
# the repo owner — that's the alert.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:discord
